# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.23.1"
  # A concrete "latest" python for the solve/import/`pip check` test rather than `*`,
  # which only entails "some" python. Update after annual migration moves out of `python_rc`.
  python_check_max: "3.15"

package:
  name: beartype
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/b/beartype/beartype-${{ version }}.tar.gz
  sha256: 8b805f246b32931c74f2b321ea0939fe5bb2ff43c12a3eff19cc4c854b832e1d

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.14.0
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - package_contents:
      strict: true
      files:
        - etc/conda/test-files/beartype/**
      site_packages:
        - beartype/**
        - beartype-${{ version }}.dist-info/**
  - python:
      imports: beartype
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - beartype_test/**
        - conftest.py
        - pytest.ini
        - README.rst
    requirements:
      run:
        - python ${{ python_min }}.*
        # required
        - pytest >=6.2.0
        # simple optionals without services/network/install from [test-tox]
        - click
        - coverage
        - numba
        - numpy
        - pandas
        - pandera
        - polars
        - pygments
        - rich-click
        - sphinx
        - sqlalchemy-with-asyncio
        - typer
        - typing_extensions
        - xarray
    script:
      # see: https://github.com/beartype/beartype/issues/744
      # test_make_beartype_file_finder_path_hook_index: may not expect as-installed package?
      #         module_spec = file_finder.find_spec('beartype')
      # >       assert isinstance(module_spec, ModuleSpec)
      # E       AssertionError: assert False
      # E        +  where False = isinstance(None, <class '_frozen_importlib.ModuleSpec'>)
      - coverage run --source=beartype --branch -m pytest -vv --tb=long --color=yes beartype_test -k "not make_beartype_file_finder_path_hook_index"
      - coverage report --show-missing --skip-covered --fail-under=90

about:
  summary: Unbearably fast near-real-time pure-Python runtime-static type-checker.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/beartype
  repository: https://github.com/beartype/beartype
  documentation: https://beartype.readthedocs.io

extra:
  recipe-maintainers:
    - leycec
